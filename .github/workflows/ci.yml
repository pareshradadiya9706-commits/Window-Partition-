name: Build and Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies if exists
        run: |
          if [ -f python_backend/requirements.txt ]; then pip install -r python_backend/requirements.txt; else echo "No python_backend/requirements.txt - skipping"; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests if exists
        run: |
          if [ -d python_backend/tests ]; then pytest python_backend/tests -v; else echo "No tests folder - skipping tests - marking success"; fi

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: cd flutter_app && flutter pub get
      - run: cd flutter_app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: window-section-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

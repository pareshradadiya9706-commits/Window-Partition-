name: Build and Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f python_backend/requirements.txt ]; then pip install -r python_backend/requirements.txt; fi
          echo "Python setup done"
      - run: |
          if [ -d python_backend/tests ]; then pytest python_backend/tests -v || true; else echo "No tests - success"; fi

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Prepare Flutter Android project
        run: |
          cd flutter_app
          if [ ! -d "android" ]; then
            echo "android folder not found - creating android platform scaffolding"
            flutter create --platforms=android .
          else
            echo "android folder already exists"
          fi
      - name: Flutter clean and pub get
        run: |
          cd flutter_app
          flutter clean
          flutter --version
          flutter pub get
      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: window-section-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

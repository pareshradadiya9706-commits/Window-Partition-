name: Build and Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest && echo "skip python deps"
      - run: echo "No tests - success"

  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: false
      - run: flutter doctor -v
      - name: Scaffold Android if missing
        run: |
          cd flutter_app
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.dharamwindow --project-name dharam_window .
          fi
      - name: Build APK
        run: |
          cd flutter_app
          flutter clean
          flutter pub get
          flutter build apk --release --no-shrink --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: window-section-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
